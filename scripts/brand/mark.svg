<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    Vevaty mark: a price tag with the V and the eyelet punched clean
    through it (fill-rule evenodd). The voids are real holes, never white
    shapes, so the mark drops onto any colour, photo or dark field with no
    second variant, and survives Android's monochrome themed-icon
    treatment, which flattens everything to a single colour.
    See BRANDING.md part 1. Do not add a double hyphen to this comment;
    it is not legal inside XML and the rasteriser rejects the file.
  -->
